<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Glowing subtle backdrop -->
  <rect width="64" height="64" rx="14" fill="#040c1a"/>
  
  <!-- Rays (Golden Amber) -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="13.6" y1="13.6" x2="17.8" y2="17.8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="50.4" y1="13.6" x2="46.2" y2="17.8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="17.5" y2="36" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="38" x2="46.5" y2="36" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Lightbulb Body Outline -->
  <path d="M21 34 C17 30 16 24 18 19 C20 14 25.5 11 32 11 C38.5 11 44 14 46 19 C48 24 47 30 43 34 C40.5 36.5 39.5 39 39 42 L25 42 C24.5 39 23.5 36.5 21 34 Z"
        fill="#07152b" stroke="#e2e8f0" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Bulb Base Threads -->
  <path d="M26 46 L38 46" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 50 L36 50" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Inside the Bulb: < X > -->
  <!-- Left Chevron '<' (Vibrant Green) -->
  <path d="M25 24 L21.5 27 L25 30" stroke="#00d285" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center 'X' (Golden Amber) -->
  <path d="M29 23.5 L35 30.5 M35 23.5 L29 30.5" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Right Chevron '>' (Vibrant Green) -->
  <path d="M39 24 L42.5 27 L39 30" stroke="#00d285" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
